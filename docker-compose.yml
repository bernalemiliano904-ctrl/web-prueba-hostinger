services:
  web:
    image: nginx:alpine
    restart: unless-stopped

    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-prueba.rule=Host(`prueba.sciesc.com`)"
      - "traefik.http.routers.web-prueba.entrypoints=web,websecure"
      - "traefik.http.routers.web-prueba.tls=true"
      - "traefik.http.routers.web-prueba.tls.certresolver=mytlschallenge"
      - "traefik.http.services.web-prueba.loadbalancer.server.port=80"

    networks:
      - proxy

networks:
  proxy:
    external: true
    name: root_default
